<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Cute</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #ffe6eb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            display: flex;
            align-items: center;
            gap: 25px;
            background: rgba(255, 255, 255, 0.4);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 105, 135, 0.15);
        }
        .avatar-box {
            width: 150px;
            height: 190px;
            border-radius: 15px;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .keypad-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .title {
            color: #d6336c;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }
        #pass-input {
            width: 190px;
            height: 40px;
            border-radius: 10px;
            border: 2px solid #ffb3c6;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #d6336c;
            background: #fff;
            margin-bottom: 15px;
            outline: none;
        }
        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 55px);
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-num {
            height: 45px;
            border-radius: 10px;
            border: none;
            background: #fff;
            color: #495057;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.06);
            transition: all 0.15s;
        }
        .btn-num:hover {
            background: #fff0f3;
            transform: translateY(-2px);
        }
        .btn-num:active {
            transform: scale(0.95);
        }
        .btn-del {
            background: #ff758f;
            color: white;
        }
        .btn-del:hover {
            background: #ff4d6d;
        }
        .btn-empty {
            visibility: hidden;
        }
        .btn-submit {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background: #ff758f;
            color: white;
            font-size: 22px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 143, 0.4);
            transition: transform 0.2s;
        }
        .btn-submit:hover {
            transform: scale(1.1);
            background: #ff4d6d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="avatar-box">
        <img src="1.jpg" alt="Avatar">
    </div>
    <div class="keypad-section">
        <div class="title">NHẬP PASS ĐI BÉ THỐI</div>
        <input type="text" id="pass-input" placeholder="Enter password" readonly>
        <div class="numpad">
            <button class="btn-num" onclick="addNum('1')">1</button>
            <button class="btn-num" onclick="addNum('2')">2</button>
            <button class="btn-num" onclick="addNum('3')">3</button>
            <button class="btn-num" onclick="addNum('4')">4</button>
            <button class="btn-num" onclick="addNum('5')">5</button>
            <button class="btn-num" onclick="addNum('6')">6</button>
            <button class="btn-num" onclick="addNum('7')">7</button>
            <button class="btn-num" onclick="addNum('8')">8</button>
            <button class="btn-num" onclick="addNum('9')">9</button>
            <div class="btn-empty"></div>
            <button class="btn-num" onclick="addNum('0')">0</button>
            <button class="btn-num btn-del" onclick="delNum()">✕</button>
        </div>
        <button class="btn-submit" onclick="checkPass()">✓</button>
    </div>
</div>

<script>
    const input = document.getElementById('pass-input');
    const CORRECT_PASS = "241108"; // Mật khẩu ngày 24/11/2008

    function addNum(num) {
        if (input.value.length < 8) {
            input.value += num;
        }
    }

    function delNum() {
        input.value = input.value.slice(0, -1);
    }
    
    function checkPass() {
        if (input.value === CORRECT_PASS) {
            alert("Mật khẩu đúng! Chuyển sang bước tiếp theo.");
            window.location.href = "sinhnhat.html";
        } else {
            alert("Sai mật khẩu rồi bé thối ơi! Gợi ý: Ngày sinh nhật 6 số nhé (ddmmyy)");
            input.value = "";
        }
    }
</script>

</body>
</html>
