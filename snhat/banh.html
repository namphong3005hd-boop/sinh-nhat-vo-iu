<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Bé Ỉn 🎂</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #fff5f8 0%, #ffdbe6 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            color: #592e3c;
            user-select: none;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }

        /* Dòng chữ chúc mừng phía trên chuẩn như ảnh */
        .top-title {
            position: absolute;
            top: 38px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            font-size: 32px;
            letter-spacing: 0.5px;
            color: #592e3c;
            pointer-events: none;
            z-index: 10;
            text-align: center;
            width: 92%;
            opacity: 0;
            transition: opacity 1s ease;
        }
        .top-title.show {
            opacity: 1;
        }

        /* Dòng nhắc nhỏ phía dưới */
        .bottom-hint {
            position: absolute;
            bottom: 36px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 15px;
            font-weight: 600;
            color: #8c5a6a;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(216, 150, 168, 0.45);
            padding: 9px 22px;
            border-radius: 25px;
            backdrop-filter: blur(4px);
            pointer-events: none;
            z-index: 10;
            animation: pulse 1.8s infinite;
            transition: opacity 0.4s ease;
            text-align: center;
            white-space: nowrap;
        }
        .bottom-hint.hide {
            opacity: 0;
        }
        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.03); }
        }

        /* Khung trình chiếu ảnh sau khi bánh tan */
        .gallery-modal {
            position: absolute;
            top: 53%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.75);
            width: 350px;
            background: rgba(255, 255, 255, 0.97);
            padding: 15px 15px 20px 15px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(180, 90, 115, 0.28), 0 0 0 4px rgba(255, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.85s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 20;
        }
        .gallery-modal.show {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) scale(1);
        }

        .photo-wrapper {
            width: 100%;
            height: 360px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            background: #ffe5ec;
        }
        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }
        .photo-wrapper img.fade {
            opacity: 0.2;
            transform: scale(0.96);
        }

        .photo-caption {
            margin-top: 14px;
            font-family: 'Dancing Script', cursive;
            font-size: 26px;
            font-weight: 700;
            color: #d6336c;
            text-align: center;
            line-height: 1.3;
            min-height: 34px;
            padding: 0 6px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 14px;
            width: 100%;
            justify-content: center;
        }
        .nav-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #ff758f, #ff4d6d);
            color: white;
            font-family: 'Quicksand', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .nav-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.45);
        }
        .nav-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div class="top-title" id="topTitle">Chúc mừng sinh nhật!</div>
<div class="bottom-hint" id="bottomHint">Chạm vào bánh để thổi nến</div>

<!-- Khung hiện từng tấm ảnh sau khi thổi nến -->
<div class="gallery-modal" id="galleryModal">
    <div class="photo-wrapper">
        <img id="slideImg" src="" alt="Kỷ niệm của bé Ỉn">
    </div>
    <div class="photo-caption" id="photoCaption">Sinh nhật thật vui vẻ</div>
    <div class="controls">
        <button class="nav-btn" onclick="changePhoto(-1)">❮ Trước</button>
        <button class="nav-btn" onclick="changePhoto(1)">Sau ❯</button>
    </div>
</div>

<canvas id="cakeCanvas"></canvas>

<script>
    // ==========================================
    // 1. DANH SÁCH 4 ẢNH & 4 DÒNG CHÚC TƯƠNG ỨNG
    // ==========================================
    const slides = [
        {
            img: "5.jpg",
            caption: "Sinh nhật thật vui vẻ"
        },
        {
            img: "2.jpg",
            caption: "Yêu bé iu nhà a nhứt"
        },
        {
            img: "3.jpg",
            caption: "Thiên thần nhỏ bé của anh"
        },
        {
            img: "4.jpg",
            caption: "Luôn bên nhau nhaa nhỏ nhắn của anh"
        }
    ];
    let currentIdx = 0;

    function updatePhoto() {
        const img = document.getElementById('slideImg');
        const caption = document.getElementById('photoCaption');
        img.classList.add('fade');
        setTimeout(() => {
            img.src = slides[currentIdx].img;
            caption.innerText = slides[currentIdx].caption;
            img.classList.remove('fade');
        }, 200);
    }

    function changePhoto(step) {
        currentIdx = (currentIdx + step + slides.length) % slides.length;
        updatePhoto();
    }

    // ==========================================
    // 2. BÁNH KEM HẠT 3D CHUẨN MẪU (NỀN HỒNG SÁNG + 5 NẾN + BẮT KEM)
    // ==========================================
    const canvas = document.getElementById('cakeCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    });

    const particles = [];
    // Bảng màu hạt thân bánh hồng phấn ánh kim tuyến giống ảnh mẫu
    const bodyColors = ['#c97b91', '#d68ea3', '#e3a6b8', '#f0c4d1', '#ffffff', '#b8687e'];
    const creamColors = ['#ffffff', '#fff7fa', '#fce8ef'];

    // Hàm tạo tầng bánh với lớp mặt kem trắng, các búi kem bồng bềnh & quả dâu đỏ
    function createCakeTier(radius, yBottom, yTop, bodyCount, puffCount) {
        // 1. Thân trụ bánh phủ hạt mịn dày đặc
        for (let i = 0; i < bodyCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const isTopSurface = Math.random() < 0.25;
            let r, y, color, size;

            if (isTopSurface) {
                r = Math.sqrt(Math.random()) * (radius - 4);
                y = yTop;
                color = creamColors[Math.floor(Math.random() * creamColors.length)];
                size = Math.random() * 1.4 + 0.9;
            } else {
                r = radius * (0.96 + Math.random() * 0.04);
                y = yBottom + Math.random() * (yTop - yBottom);
                color = bodyColors[Math.floor(Math.random() * bodyColors.length)];
                size = Math.random() * 1.5 + 0.9;
            }

            particles.push({
                x: (Math.random() - 0.5) * 1600,
                y: (Math.random() - 0.5) * 1600,
                z: (Math.random() - 0.5) * 1600,
                tx: Math.cos(angle) * r,
                ty: y,
                tz: Math.sin(angle) * r,
                vx: 0, vy: 0, vz: 0,
                size: size,
                color: color,
                type: 'cake',
                alpha: 0.95
            });
        }

        // 2. Các búi kem trắng tròn bồng bềnh viền quanh mép trên tầng bánh + nụ dâu đỏ
        for (let p = 0; p < puffCount; p++) {
            const puffAngle = (p / puffCount) * Math.PI * 2;
            const puffCenterR = radius - 6;
            const cx = Math.cos(puffAngle) * puffCenterR;
            const cz = Math.sin(puffAngle) * puffCenterR;
            const cy = yTop - 4;

            // Khối cầu hạt kem trắng
            for (let k = 0; k < 42; k++) {
                const u = Math.random() * Math.PI * 2;
                const v = Math.acos(2 * Math.random() - 1);
                const rad = Math.cbrt(Math.random()) * 7.5;
                particles.push({
                    x: (Math.random() - 0.5) * 1600,
                    y: (Math.random() - 0.5) * 1600,
                    z: (Math.random() - 0.5) * 1600,
                    tx: cx + rad * Math.sin(v) * Math.cos(u),
                    ty: cy + rad * Math.cos(v) * 0.85,
                    tz: cz + rad * Math.sin(v) * Math.sin(u),
                    vx: 0, vy: 0, vz: 0,
                    size: 1.4,
                    color: k % 4 === 0 ? '#f7dce5' : '#ffffff',
                    type: 'cake',
                    alpha: 0.98
                });
            }

            // Nụ dâu / hoa hồng đỏ xen kẽ trên các búi kem
            if (p % 2 === 0) {
                for (let b = 0; b < 14; b++) {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.acos(2 * Math.random() - 1);
                    const rad = Math.cbrt(Math.random()) * 3.5;
                    particles.push({
                        x: (Math.random() - 0.5) * 1600,
                        y: (Math.random() - 0.5) * 1600,
                        z: (Math.random() - 0.5) * 1600,
                        tx: cx + rad * Math.sin(v) * Math.cos(u),
                        ty: (cy - 5) + rad * Math.cos(v),
                        tz: cz + rad * Math.sin(v) * Math.sin(u),
                        vx: 0, vy: 0, vz: 0,
                        size: 1.5,
                        color: b % 2 === 0 ? '#e63946' : '#ff4d6d',
                        type: 'cake',
                        alpha: 1
                    });
                }
            }
        }
    }

    // 1. Đĩa viền mảnh tinh tế ở đáy bánh
    for (let i = 0; i < 650; i++) {
        const angle = (i / 650) * Math.PI * 2;
        const r = 188 + (Math.random() - 0.5) * 2.5;
        particles.push({
            x: (Math.random() - 0.5) * 1600,
            y: (Math.random() - 0.5) * 1600,
            z: (Math.random() - 0.5) * 1600,
            tx: Math.cos(angle) * r,
            ty: 118,
            tz: Math.sin(angle) * r,
            vx: 0, vy: 0, vz: 0,
            size: 1.3,
            color: '#b88c9a',
            type: 'cake',
            alpha: 0.75
        });
    }

    // 2. Tạo 3 tầng bánh chuẩn tỉ lệ ảnh mẫu
    createCakeTier(136, 114, 52, 3400, 26);  // Tầng 1 (dưới)
    createCakeTier(98, 52, -4, 2500, 20);    // Tầng 2 (giữa)
    createCakeTier(64, -4, -52, 1700, 14);   // Tầng 3 (trên cùng)

    // 3. Tạo 5 cây nến trắng bạc xếp vòng trên tầng 3 như ảnh
    const numCandles = 5;
    for (let c = 0; c < numCandles; c++) {
        const cAngle = (c / numCandles) * Math.PI * 2 - Math.PI / 2;
        const cDist = 26;
        const cx = Math.cos(cAngle) * cDist;
        const cz = Math.sin(cAngle) * cDist;

        // Thân nến mảnh màu trắng xám bạc
        for (let i = 0; i < 180; i++) {
            const angle = Math.random() * Math.PI * 2;
            const r = Math.random() * 3.2;
            const h = Math.random() * 44;
            const y = -52 - h;
            particles.push({
                x: (Math.random() - 0.5) * 1600,
                y: (Math.random() - 0.5) * 1600,
                z: (Math.random() - 0.5) * 1600,
                tx: cx + Math.cos(angle) * r,
                ty: y,
                tz: cz + Math.sin(angle) * r,
                vx: 0, vy: 0, vz: 0,
                size: 1.4,
                color: i % 3 === 0 ? '#d8d8e0' : '#ffffff',
                type: 'cake',
                alpha: 0.98
            });
        }

        // Ngọn lửa vàng ấm áp trên đầu nến
        for (let i = 0; i < 120; i++) {
            const u = Math.random();
            const r = (1 - u) * 6.2 * Math.random();
            const angle = Math.random() * Math.PI * 2;
            const y = -99 - u * 24;
            particles.push({
                x: (Math.random() - 0.5) * 1600,
                y: (Math.random() - 0.5) * 1600,
                z: (Math.random() - 0.5) * 1600,
                tx: cx + Math.cos(angle) * r,
                ty: y,
                tz: cz + Math.sin(angle) * r,
                baseTx: cx + Math.cos(angle) * r,
                baseTy: y,
                baseTz: cz + Math.sin(angle) * r,
                vx: 0, vy: 0, vz: 0,
                size: Math.random() * 2.4 + 1.3,
                color: u > 0.5 ? '#ffb703' : (u > 0.2 ? '#ffd166' : '#fff8d6'),
                type: 'flame',
                phase: Math.random() * Math.PI * 2,
                alpha: 0.95
            });
        }
    }

    // Hạt bụi hồng nhẹ bay lơ lửng xung quanh
    for (let i = 0; i < 180; i++) {
        particles.push({
            x: (Math.random() - 0.5) * 1200,
            y: (Math.random() - 0.5) * 900,
            z: (Math.random() - 0.5) * 1200,
            tx: 0, ty: 0, tz: 0,
            vx: (Math.random() - 0.5) * 0.35,
            vy: -Math.random() * 0.4 - 0.1,
            vz: (Math.random() - 0.5) * 0.35,
            size: Math.random() * 1.8 + 0.8,
            color: '#e3a6b8',
            type: 'bg',
            alpha: Math.random() * 0.45 + 0.15
        });
    }

    // Điều khiển góc xoay 3D & 3 trạng thái:
    // 'lit' (5 nến đang cháy) -> 'blown' (thổi tắt nến, bốc khói) -> 'exploded' (nổ tung hiện ảnh)
    let rotY = 0;
    let rotX = 0.26;
    let isDragging = false;
    let dragDistance = 0;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let state = 'lit';
    let frameCount = 0;

    setTimeout(() => {
        document.getElementById('topTitle').classList.add('show');
    }, 800);

    function onPointerDown(x, y) {
        isDragging = true;
        dragDistance = 0;
        lastMouseX = x;
        lastMouseY = y;
    }

    function onPointerMove(x, y) {
        if (!isDragging) return;
        const dx = x - lastMouseX;
        const dy = y - lastMouseY;
        dragDistance += Math.abs(dx) + Math.abs(dy);
        rotY += dx * 0.008;
        rotX = Math.max(-0.15, Math.min(0.75, rotX + dy * 0.005));
        lastMouseX = x;
        lastMouseY = y;
    }

    function onPointerUp() {
        isDragging = false;
        if (dragDistance < 8 && frameCount > 50) {
            if (state === 'lit') {
                blowOutCandles();
            } else if (state === 'blown') {
                explodeCake();
            }
        }
    }

    canvas.addEventListener('mousedown', e => onPointerDown(e.clientX, e.clientY));
    window.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', e => {
        if (e.touches.length > 0) onPointerDown(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchmove', e => {
        if (e.touches.length > 0) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
    });
    window.addEventListener('touchend', onPointerUp);

    // BƯỚC 1: Thổi tắt 5 ngọn nến
    function blowOutCandles() {
        state = 'blown';
        const hint = document.getElementById('bottomHint');
        hint.innerText = "Nến tắt rồi! Chạm vào bánh lần nữa để mở quà nhé ✨";

        particles.forEach(p => {
            if (p.type === 'flame') {
                p.type = 'smoke';
                p.color = '#adb5bd';
                p.vx = (Math.random() - 0.5) * 0.8;
                p.vy = -Math.random() * 1.6 - 0.7;
                p.vz = (Math.random() - 0.5) * 0.8;
                p.alpha = 0.75;
            }
        });
    }

    // BƯỚC 2: Bánh nổ tan & hiện 4 tấm ảnh
    function explodeCake() {
        state = 'exploded';
        document.getElementById('bottomHint').classList.add('hide');

        particles.forEach(p => {
            if (p.type === 'cake' || p.type === 'smoke') {
                const speed = Math.random() * 14 + 4;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;
                p.vx = Math.sin(phi) * Math.cos(theta) * speed;
                p.vy = Math.cos(phi) * speed - 3;
                p.vz = Math.sin(phi) * Math.sin(theta) * speed;
            }
        });

        setTimeout(() => {
            updatePhoto();
            document.getElementById('galleryModal').classList.add('show');
        }, 1200);
    }

    function animate() {
        requestAnimationFrame(animate);
        frameCount++;

        // Xóa canvas trong suốt để giữ trọn nền gradient hồng pastel sáng của body
        ctx.clearRect(0, 0, width, height);

        if (!isDragging && state !== 'exploded') {
            rotY += 0.0055;
        }

        const cosY = Math.cos(rotY);
        const sinY = Math.sin(rotY);
        const cosX = Math.cos(rotX);
        const sinX = Math.sin(rotX);
        const fov = 560;

        for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            if (p.type === 'bg') {
                p.x += p.vx;
                p.y += p.vy;
                p.z += p.vz;
                if (p.y < -450) p.y = 450;
            } else if (p.type === 'smoke') {
                p.x += p.vx + Math.sin(frameCount * 0.08 + i) * 0.25;
                p.y += p.vy;
                p.z += p.vz;
                p.alpha -= 0.011;
            } else if (state === 'lit' || state === 'blown') {
                if (p.type === 'flame') {
                    p.tx = p.baseTx + Math.sin(frameCount * 0.16 + p.phase) * 2.2;
                    p.ty = p.baseTy + Math.cos(frameCount * 0.22 + p.phase) * 2.5;
                }
                p.x += (p.tx - p.x) * 0.075;
                p.y += (p.ty - p.y) * 0.075;
                p.z += (p.tz - p.z) * 0.075;
            } else if (state === 'exploded') {
                p.x += p.vx;
                p.y += p.vy;
                p.z += p.vz;
                p.vx *= 0.965;
                p.vy *= 0.965;
                p.vz *= 0.965;
                p.alpha -= 0.009;
            }

            if (p.alpha <= 0) continue;

            // Chiếu tọa độ 3D -> 2D
            let x1 = p.x * cosY - p.z * sinY;
            let z1 = p.z * cosY + p.x * sinY;
            let y1 = p.y * cosX - z1 * sinX;
            let z2 = z1 * cosX + p.y * sinX;

            const scale = fov / (fov + z2 + 360);
            if (scale <= 0) continue;

            const screenX = width / 2 + x1 * scale;
            const screenY = height / 2 + y1 * scale + 25;

            ctx.globalAlpha = Math.max(0, Math.min(1, p.alpha));
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(screenX, screenY, p.size * scale, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    animate();
</script>

</body>
</html>
